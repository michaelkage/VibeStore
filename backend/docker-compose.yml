services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    command: ["sh", "-c", "python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    networks: [app_net, patch_internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: .
    env_file: .env
    command: ["arq", "app.worker.WorkerSettings"]
    networks: [app_net]
    depends_on:
      api: { condition: service_healthy }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  patch-worker:
    build: .
    env_file: .env
    command: ["arq", "app.patch_worker.PatchWorkerSettings"]
    networks: [patch_internal]
    depends_on:
      api: { condition: service_healthy }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    restart: unless-stopped
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vibestore
      POSTGRES_USER: vibestore
      POSTGRES_PASSWORD: vibestore
    ports: ["5432:5432"]
    volumes: ["vibestore_pg:/var/lib/postgresql/data"]
    networks: [app_net, patch_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibestore -d vibestore"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [app_net, patch_internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  vibestore_pg:
networks:
  app_net: {}
  patch_internal:
    internal: true
