services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: .
    env_file: .env
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vibestore
      POSTGRES_USER: vibestore
      POSTGRES_PASSWORD: vibestore
    ports: ["5432:5432"]
    volumes: ["vibestore_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibestore -d vibestore"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  vibestore_pg:
