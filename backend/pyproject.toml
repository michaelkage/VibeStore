[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibestore-api"
version = "0.2.0"
description = "VibeStore discovery and repository intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "asyncpg>=0.29,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "pgvector>=0.3,<1",
  "redis>=5,<6",
  "PyJWT[crypto]>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
ignore = ["I001", "B008"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
