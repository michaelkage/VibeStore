name: Flutter VibeStore Integration CI
on:
  pull_request:
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/flutter-vibestore-ci.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/flutter-vibestore-ci.yml"
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/services/vibestore_api.dart lib/pages/vibestore_discover.dart lib/pages/apps.dart
      - run: flutter analyze --no-pub lib/services/vibestore_api.dart lib/pages/vibestore_discover.dart lib/pages/apps.dart
